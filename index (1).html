<script>
/* __CET6_MATCH_BOOTSTRAP_V1__ */
(async function(){
  const REPO_OWNER='awnighthunt';
  const REPO_NAME='cet6';
  const BASE_CACHE_KEY='blindtype_cet6_base_html_match_v1';

  function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function showError(msg){
    const spin=document.getElementById('spin');
    const box=document.getElementById('bootError');
    if(spin)spin.style.display='none';
    if(box){box.style.display='block';box.textContent=msg;}
  }

  async function fetchText(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }

  async function getBaseHtml(){
    const cached=safeGet(BASE_CACHE_KEY);
    if(cached && cached.includes("const STORE_KEY='blindtype_cet6_v1'") && cached.includes('id="view-library"')){
      return cached;
    }

    // 上传到 GitHub 前本地预览时，main 仍是旧版，直接可取。
    try{
      const mainRaw='https://raw.githubusercontent.com/'+REPO_OWNER+'/'+REPO_NAME+'/main/index.html';
      const mainText=await fetchText(mainRaw);
      if(mainText.includes("const STORE_KEY='blindtype_cet6_v1'") &&
         mainText.includes('id="view-library"') &&
         !mainText.includes('__CET6_MATCH_BOOTSTRAP_V1__')){
        safeSet(BASE_CACHE_KEY,mainText);
        return mainText;
      }
    }catch(e){}

    // 覆盖 index.html 后，从该文件的历史提交中自动找到最近的旧版。
    const api='https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/commits?path=index.html&per_page=12';
    const r=await fetch(api,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error('无法读取 GitHub 历史版本（HTTP '+r.status+'）');
    const commits=await r.json();
    for(const c of commits){
      if(!c || !c.sha)continue;
      try{
        const raw='https://raw.githubusercontent.com/'+REPO_OWNER+'/'+REPO_NAME+'/'+c.sha+'/index.html';
        const text=await fetchText(raw);
        if(text.includes("const STORE_KEY='blindtype_cet6_v1'") &&
           text.includes('id="view-library"') &&
           text.includes('const CET6') &&
           !text.includes('__CET6_MATCH_BOOTSTRAP_V1__')){
          safeSet(BASE_CACHE_KEY,text);
          return text;
        }
      }catch(e){}

    function matchIsPracticed(x){

      return !!(r && r.attempts>0);

      const all=matchAllWords();
      if(matchGame.scope==='practiced')return all.filter(matchIsPracticed);
      if(matchGame.scope==='unpracticed')return all.filter(x=>!matchIsPracticed(x));
      return all;
    }

      const out=[...a];
      for(let i=out.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));

          const selected=document.querySelector('.match-card.selected[data-side="'+side+'"]');

          btn.classList.toggle('selected');

        '<button class="match-card match-cn" data-side="right" data-key="'+matchEsc(x.w.toLowerCase())+'" title="'+matchEsc(matchMeaning(x.m))+'"><span>'+matchEsc(matchMeaning(x.m))+'</span></button>'
      ).join('');
      bindMatchCards();
    }
    function clearPairSelection(){
      if(matchGame.left)matchGame.left.classList.remove('selected');
      if(matchGame.right)matchGame.right.classList.remove('selected');
      matchGame.left=null;matchGame.right=null;
    }
    function evaluateMatch(){
      if(matchGame.locked||!matchGame.left||!matchGame.right)return;
      matchGame.locked=true;
      const a=matchGame.left,b=matchGame.right;
      const ok=a.dataset.key===b.dataset.key;
      if(ok){
        matchGame.matched.add(a.dataset.key);
        matchGame.combo++;
        matchGame.bestCombo=Math.max(matchGame.bestCombo,matchGame.combo);
        a.classList.remove('selected');b.classList.remove('selected');
        a.classList.add('matched','correct');b.classList.add('matched','correct');
        setMatchStatus(matchGame.combo>=3?'🔥 Combo ×'+matchGame.combo+'！':'✓ 匹配正确','ok');
        matchGame.left=null;matchGame.right=null;
        updateMatchStats();

          if(matchGame.matched.size>=5)finishMatchRound();

        matchGame.errors++;

        a.classList.add('wrong');b.classList.add('wrong');
        setMatchStatus('不对，再碰一次','bad');
        updateMatchStats();
        setTimeout(()=>{
          a.classList.remove('wrong','selected');

    }

      document.getElementById('matchEmpty').style.display='block';
      document.getElementById('matchEmpty').textContent=message;
      document.getElementById('matchNextBtn').disabled=true;
      matchGame.startAt=0;matchGame.finishedAt=0;
      updateMatchStats();
      document.getElementById('matchTimer').textContent='0:00';
    }
    function startMatchRound(){
      document.getElementById('matchEmpty').style.display='none';
      const pool=matchPool();
      const label=matchGame.scope==='practiced'?'练过':matchGame.scope==='unpracticed'?'未练':'全部';
      document.getElementById('matchPoolInfo').textContent=label+'单词 · '+pool.length+' 个可用';
      if(pool.length<5){
        emptyMatch(label+'单词不足 5 个，请切换其他范围或先完成更多单词训练。');
        setMatchStatus('当前范围不足 5 个单词','bad');
        return;
      }
      matchGame.words=matchShuffle(pool).slice(0,5);
      matchGame.leftOrder=matchShuffle(matchGame.words);
      matchGame.rightOrder=matchShuffle(matchGame.words);
      matchGame.left=null;matchGame.right=null;
      matchGame.matched=new Set();
      matchGame.combo=0;matchGame.bestCombo=0;matchGame.errors=0;
      matchGame.startAt=Date.now();matchGame.finishedAt=0;matchGame.locked=false;
      document.getElementById('matchNextBtn').disabled=true;
      setMatchStatus('先点英文，再碰对应中文','');
      renderMatchCards();
      updateMatchStats();
      updateMatchTimer();
    }
    function openMatchGame(){
      if(typeof nav==='function')nav('match');
      document.querySelectorAll('[data-match-scope]').forEach(b=>b.classList.toggle('active',b.dataset.matchScope===matchGame.scope));
      startMatchRound();
    }

    const matchBtn=document.getElementById('matchBtn');
    if(matchBtn)matchBtn.onclick=openMatchGame;
    const back=document.getElementById('matchBackBtn');
    if(back)back.onclick=()=>typeof nav==='function'?nav('library'):history.back();
    const next=document.getElementById('matchNextBtn');
    if(next)next.onclick=startMatchRound;
    document.querySelectorAll('[data-match-scope]').forEach(b=>{
      b.onclick=()=>{
        matchGame.scope=b.dataset.matchScope;
        document.querySelectorAll('[data-match-scope]').forEach(x=>x.classList.toggle('active',x===b));
        startMatchRound();
      };
    });
    setInterval(updateMatchTimer,500);
  }

  function patchBase(base){
    if(base.includes('id="view-match"'))return base;

    const css=`

@keyframes matchShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

`;

    const matchView=`
<section class="view match-page" id="view-match">
  <div class="match-top">
    <div class="match-title">
      <button class="match-back" id="matchBackBtn">← 单词记录</button>
      <h2>单词连连碰</h2>
      <p>每组 5 个。英文、中文分别打散；配对成功会自动消除。</p>
    </div>
  </div>
  <div class="match-controls">
    <div class="match-tabs">
      <button class="match-scope active" data-match-scope="practiced">练过</button>
      <button class="match-scope" data-match-scope="unpracticed">未练</button>
      <button class="match-scope" data-match-scope="all">全部</button>
    </div>
    <div class="match-pool-info" id="matchPoolInfo">读取中…</div>
  </div>
  <div class="match-summary">
    <div class="match-stat"><b id="matchDone">0 / 5</b><span>已配对</span></div>
    <div class="match-stat"><b id="matchCombo">×0</b><span>当前连击</span></div>
    <div class="match-stat"><b id="matchErrors">0</b><span>失误</span></div>
    <div class="match-stat"><b id="matchTimer">0:00</b><span>用时</span></div>
  </div>
  <div class="match-progress-track"><i id="matchProgress"></i></div>
  <div class="match-board">
    <div class="match-col"><div class="match-col-title">ENGLISH</div><div class="match-col" id="matchLeft"></div></div>
    <div class="match-col"><div class="match-col-title">中文释义</div><div class="match-col" id="matchRight"></div></div>
    <div class="match-empty" id="matchEmpty"></div>
  </div>
  <div class="match-status" id="matchStatus">先点英文，再碰对应中文</div>
  <div class="match-footer"><button class="primary" id="matchNextBtn" disabled>下一组 5 个 →</button></div>
</section>
`;

    // CSS
    const styleClose=base.indexOf('</style>');
    if(styleClose!==-1)base=base.slice(0,styleClose)+css+base.slice(styleClose);

    // 单词记录工具栏中的入口
    if(!base.includes('id="matchBtn"')){
      base=base.replace(
        /(<button class="secondary" id="onlyPracticed">[\s\S]*?<\/button>)/,
        '$1<button class="primary" id="matchBtn">连连碰 ✦</button>'
      );
    }

    // 新页面插在设置页前
    const settingsMarker='<section class="view settings" id="view-settings">';
    if(base.includes(settingsMarker)){
      base=base.replace(settingsMarker,matchView+settingsMarker);
    }

    // 将运行逻辑作为独立经典脚本追加到 body 末尾
    const runtimeTag='<scr'+'ipt>('+matchRuntime.toString()+')();</scr'+'ipt>';
    base=base.replace('</body>',runtimeTag+'\n</body>');
    return base;
  }

  try{
    const base=await getBaseHtml();
    const patched=patchBase(base);
    document.open();
    document.write(patched);
    document.close();
  }catch(err){
    showError('载入失败：'+(err&&err.message?err.message:String(err))+'。请确认网络可访问 GitHub，然后刷新页面。你的原学习记录没有被修改。');
  }
})();
