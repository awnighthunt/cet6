.match-board{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative}.match-col{display:grid;gap:10px}.match-col-title{font-size:11px;color:#949bad;font-weight:850;letter-spacing:1px;padding:0 3px 2px}.match-card{min-height:64px;border:1.5px solid #e5e8ef;border-radius:16px;background:#fff;color:var(--ink);padding:12px 14px;box-shadow:0 7px 18px rgba(35,44,67,.05);transition:transform .16s,box-shadow .16s,border-color .16s,background .16s,opacity .22s;text-align:center}.match-card span{display:block}.match-en{font-size:17px;font-weight:900;letter-spacing:.15px}.match-cn{font-size:13px;font-weight:760;line-height:1.45}.match-card:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(35,44,67,.08)}.match-card.selected{border-color:#9488ff;background:#f2f0ff;color:#5547ce;transform:translateY(-2px);box-shadow:0 10px 26px rgba(109,93,252,.15)}.match-card.correct{border-color:#7bd4b5;background:#eefaf5;color:#16855f}.match-card.matched{opacity:.2;transform:scale(.92);pointer-events:none}.match-card.wrong{border-color:#ef9ca5;background:#fff2f3;color:#c64955;animation:matchShake .22s linear 2}@keyframes matchShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match-status{min-height:42px;margin-top:15px;border-radius:14px;background:#f7f8fb;display:flex;align-items:center;justify-content:center;padding:9px 12px;font-size:12px;font-weight:850;color:#747d90}.match-status.ok{background:var(--green-soft);color:var(--green)}.match-status.bad{background:var(--red-soft);color:var(--red)}.match-footer{display:flex;justify-content:center;gap:9px;margin-top:12px}.match-empty{display:none;grid-column:1/-1;border:1px dashed #dfe3ea;border-radius:18px;padding:34px 18px;text-align:center;color:#929aad;font-size:13px;line-height:1.7}
@media(max-width:640px){.match-page{padding:16px 13px 100px;min-height:calc(100svh - 60px)}.match-top{align-items:center}.match-title h2{font-size:25px;margin-top:5px}.match-title p{font-size:10px}.match-controls{padding:9px}.match-scope{padding:7px 10px;font-size:11px}.match-summary{gap:5px}.match-stat{padding:8px 7px;text-align:center}.match-stat b{font-size:16px}.match-stat span{font-size:9px}.match-board{gap:8px}.match-col{gap:7px}.match-card{min-height:58px;border-radius:13px;padding:9px 8px}.match-en{font-size:14px}.match-cn{font-size:11px;line-height:1.35}.toolbar #matchBtn{padding:10px 12px;font-size:11px}}
`;
    const view=`
<section class="view match-page" id="view-match">
  <div class="match-top"><div class="match-title"><button class="match-back" id="matchBackBtn">← 单词记录</button><h2>单词连连碰</h2><p>每组 5 个，英文与中文分别打散。点击一张英文，再点对应中文。</p></div></div>
  <div class="match-controls"><div class="match-tabs"><button class="match-scope active" data-match-scope="practiced">练过</button><button class="match-scope" data-match-scope="unpracticed">未练</button><button class="match-scope" data-match-scope="all">全部</button></div><div class="match-pool-info" id="matchPoolInfo">读取中…</div></div>
  <div class="match-summary"><div class="match-stat"><b id="matchDone">0 / 5</b><span>已配对</span></div><div class="match-stat"><b id="matchCombo">×0</b><span>当前连击</span></div><div class="match-stat"><b id="matchErrors">0</b><span>失误</span></div><div class="match-stat"><b id="matchTimer">0:00</b><span>用时</span></div></div>
  <div class="match-progress-track"><i id="matchProgress"></i></div>
  <div class="match-board"><div class="match-col"><div class="match-col-title">ENGLISH</div><div class="match-col" id="matchLeft"></div></div><div class="match-col"><div class="match-col-title">中文释义</div><div class="match-col" id="matchRight"></div></div><div class="match-empty" id="matchEmpty"></div></div>
  <div class="match-status" id="matchStatus">先点英文，再点对应中文</div><div class="match-footer"><button class="primary" id="matchNextBtn" disabled>下一组 5 个 →</button></div>
</section>`;

    base=base.replace('</style>',css+'\n</style>');
    const oldBtn='<button class="secondary" id="onlyPracticed">只看练过</button>';
    if(base.includes(oldBtn))base=base.replace(oldBtn,oldBtn+'<button class="primary" id="matchBtn">连连碰 ✦</button>');
    else throw new Error('未找到“只看练过”按钮，基础版本不匹配');
    const settings='<section class="view settings" id="view-settings">';
    if(base.includes(settings))base=base.replace(settings,view+'\n'+settings);else throw new Error('未找到设置页面插入点');
    base=base.replace('</body>','<script>('+runtime.toString()+')();<\/script>\n</body>');
    return base;
  }

  try{
    const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw new Error('基础文件读取失败 HTTP '+r.status);const base=await r.text();
    if(!base.includes("const STORE_KEY='blindtype_cet6_v1'"))throw new Error('基础版本校验失败');
    const out=patch(base);document.open();document.write(out);document.close();
  }catch(e){showError('载入失败：'+(e&&e.message?e.message:String(e))+'。原学习记录没有被修改。')}
})();
</script>
